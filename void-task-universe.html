<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VOID — Task Universe</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600&display=swap');
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
:root{--bg:#020307;--white:#f4f4f1;--muted:#747984;--line:rgba(255,255,255,.11)}
body{font-family:Inter,Arial;background:#020307;color:var(--white)}
button,input,select,textarea{font:inherit}button{cursor:pointer}
#space{position:fixed;inset:0;overflow:hidden;background:
radial-gradient(circle at 50% 48%,rgba(90,105,255,.09),transparent 23%),
radial-gradient(circle at 30% 65%,rgba(160,70,255,.055),transparent 25%),
#020307}
#space:before{content:"";position:absolute;inset:-50%;background:
conic-gradient(from 0deg,transparent 0 18%,rgba(120,130,255,.045) 21%,transparent 25% 42%,rgba(255,255,255,.025) 45%,transparent 50% 75%,rgba(150,80,255,.04) 78%,transparent 82%);
filter:blur(50px);animation:nebula 28s linear infinite}
@keyframes nebula{to{transform:rotate(360deg) scale(1.08)}}
#stars,#stars2{position:absolute;inset:0;pointer-events:none}
.star{position:absolute;width:1px;height:1px;background:#fff;border-radius:50%;opacity:.25;animation:twinkle var(--t) ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.75;transform:scale(1.8)}}
#orbit{position:absolute;left:50%;top:50%;width:min(72vw,780px);height:min(72vw,780px);transform:translate(-50%,-50%) rotate(-8deg);border:1px solid rgba(255,255,255,.045);border-radius:50%;box-shadow:0 0 100px rgba(100,110,255,.035)}
#orbit:before,#orbit:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.035);border-radius:50%;inset:12% 0;transform:rotate(68deg)}
#orbit:after{inset:25% -8%;transform:rotate(-25deg)}
#field{position:absolute;inset:0}
.node{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;text-align:center;
border:1px solid rgba(255,255,255,.18);background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.20),rgba(30,33,48,.52) 55%,rgba(4,5,10,.85));
box-shadow:0 0 20px rgba(115,130,255,.08),inset 0 0 25px rgba(255,255,255,.035);
backdrop-filter:blur(3px);transition:.4s cubic-bezier(.2,.8,.2,1);animation:float var(--dur) ease-in-out infinite alternate;z-index:2}
.node:before{content:"";position:absolute;inset:-7px;border-radius:50%;border:1px solid rgba(140,150,255,.08);animation:pulse 3s ease-in-out infinite}
.node:hover{transform:scale(1.12)!important;border-color:rgba(190,200,255,.55);box-shadow:0 0 45px rgba(110,130,255,.22),inset 0 0 25px rgba(255,255,255,.08);z-index:10}
.node.done{opacity:.18;filter:grayscale(1)}
.name{font:500 var(--fs) "Space Grotesk";line-height:1.12;max-width:82%;letter-spacing:-.025em}
.cat{position:absolute;bottom:17%;font-size:7px;letter-spacing:.17em;text-transform:uppercase;color:#7d8390}
@keyframes float{from{margin-left:var(--a);margin-top:var(--b)}to{margin-left:var(--c);margin-top:var(--d)}}
@keyframes pulse{50%{transform:scale(1.12);opacity:.35}}
header{position:fixed;z-index:20;top:0;left:0;right:0;height:90px;padding:23px 28px;display:flex;align-items:flex-start;justify-content:space-between;background:linear-gradient(#020307,rgba(2,3,7,.65),transparent)}
.brand{font:500 15px "Space Grotesk";letter-spacing:.18em}.brand span{display:block;color:#656b77;font:400 9px Inter;letter-spacing:.12em;margin-top:7px}
.status{text-align:center;position:absolute;left:50%;transform:translateX(-50%);top:25px;color:#8b909b;font-size:9px;letter-spacing:.18em;text-transform:uppercase}
.status b{display:block;color:#eee;font:500 13px "Space Grotesk";letter-spacing:0;text-transform:none;margin-top:5px}
.actions{display:flex;gap:7px}.btn{background:rgba(255,255,255,.045);border:1px solid var(--line);color:#bfc2ca;border-radius:99px;padding:8px 12px;font-size:10px;transition:.2s}
.btn:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:white}
.btn.add{color:white}
#bottom{position:fixed;z-index:20;bottom:22px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:end;color:#5f6470;font-size:9px;letter-spacing:.06em}
#bottom strong{color:#cfd2d9;font-weight:500}
#filters{display:flex;gap:5px;position:absolute;left:50%;bottom:19px;transform:translateX(-50%);padding:4px;border:1px solid var(--line);border-radius:99px;background:rgba(5,6,10,.65);backdrop-filter:blur(15px)}
.filter{border:0;background:transparent;color:#666b76;border-radius:99px;padding:7px 10px;font-size:9px}.filter.active{background:#e9e9e6;color:#101116}
#panel{position:fixed;z-index:40;right:18px;top:18px;width:380px;max-width:calc(100% - 36px);height:calc(100% - 36px);padding:24px;
background:rgba(8,10,16,.9);border:1px solid rgba(255,255,255,.13);border-radius:20px;backdrop-filter:blur(28px);box-shadow:0 25px 100px #000;
transform:translateX(120%);transition:.45s cubic-bezier(.2,.8,.2,1)}
#panel.open{transform:translateX(0)}.paneltop{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}.paneltop h2{font:500 19px "Space Grotesk";margin:0}.close{border:0;background:none;color:#777d88;font-size:25px}
label{display:block;color:#6e7480;font-size:8px;letter-spacing:.16em;text-transform:uppercase;margin:0 0 7px}
.field{margin-bottom:16px}input,select,textarea{width:100%;color:#eee;background:#07090e;border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:11px;outline:0}textarea{height:90px;resize:none}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.save{width:100%;border:0;background:#eee;color:#08090d;border-radius:9px;padding:12px;font-weight:600}.delete{width:100%;margin-top:8px;border:1px solid rgba(255,100,100,.16);background:transparent;color:#d77b7b;border-radius:9px;padding:10px}
#search{position:fixed;z-index:35;top:76px;left:50%;transform:translateX(-50%);display:none;width:300px}#search.open{display:block}#search input{border-radius:99px;background:rgba(7,9,14,.9);backdrop-filter:blur(18px)}
#hint{position:fixed;left:28px;bottom:22px;color:#505560;font-size:9px}#hint b{color:#aeb3bd;font-weight:500}
#empty{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#565b66;font-size:11px}
@media(max-width:650px){header{padding:19px 16px}.status{display:none}#bottom{left:16px;right:16px;bottom:70px}.brand{font-size:13px}#filters{max-width:calc(100% - 20px);overflow:auto;white-space:nowrap;bottom:15px}.btn{padding:7px 9px}}
</style>
</head>
<body>
<div id="space"><div id="stars"></div><div id="stars2"></div><div id="orbit"></div><div id="field"></div><div id="empty">THE VOID IS QUIET.</div></div>
<header><div class="brand">VOID<span>PERSONAL TASK UNIVERSE</span></div><div class="status">LOCAL SYSTEM<b id="date"></b></div><div class="actions"><button class="btn" id="searchBtn">SEARCH</button><button class="btn add" id="addBtn">＋ TASK</button></div></header>
<div id="search"><input id="query" placeholder="Search the universe…"></div>
<div id="hint"><b>CLICK</b> open · <b>DOUBLE CLICK</b> complete · <b>N</b> new</div>
<div id="bottom"><div><strong id="stats"></strong></div><div>DRAG TO EXPLORE</div></div>
<div id="filters"><button class="filter active" data-f="all">ALL</button><button class="filter" data-f="active">ACTIVE</button><button class="filter" data-f="done">DONE</button><button class="filter" data-f="College">COLLEGE</button><button class="filter" data-f="Coding">CODING</button><button class="filter" data-f="Gym">GYM</button><button class="filter" data-f="Personal">PERSONAL</button></div>
<aside id="panel"><div class="paneltop"><h2 id="ptitle">New task</h2><button class="close" id="close">×</button></div><form id="form"><input type="hidden" id="id"><div class="field"><label>Task</label><input id="title" required placeholder="What needs to happen?"></div><div class="grid"><div class="field"><label>Category</label><select id="category"><option>College</option><option>Coding</option><option>Gym</option><option>Personal</option><option>Important</option><option>Other</option></select></div><div class="field"><label>Priority</label><select id="priority"><option value="low">Low</option><option value="medium" selected>Medium</option><option value="high">High</option></select></div></div><div class="field"><label>Due date</label><input type="date" id="due"></div><div class="field"><label>Notes</label><textarea id="notes" placeholder="Optional…"></textarea></div><button class="save" id="save">Create task</button><button class="delete" type="button" id="delete" style="display:none">Delete task</button></form></aside>
<script>
const KEY="void_task_universe";let tasks=JSON.parse(localStorage.getItem(KEY)||"null")||[
{id:crypto.randomUUID(),title:"Study DSA",category:"College",priority:"high",done:false,due:"",notes:""},
{id:crypto.randomUUID(),title:"Practice C++",category:"Coding",priority:"medium",done:false,due:"",notes:""},
{id:crypto.randomUUID(),title:"Go to gym",category:"Gym",priority:"medium",done:false,due:"",notes:""},
{id:crypto.randomUUID(),title:"Portfolio",category:"Coding",priority:"low",done:false,due:"",notes:""},
{id:crypto.randomUUID(),title:"Review attendance",category:"College",priority:"low",done:false,due:"",notes:""}
];
let filter="all";const field=document.getElementById("field"),panel=document.getElementById("panel"),q=document.getElementById("query");
function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}
function esc(s){return s.replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]))}
function stars(){for(let layer=0;layer<2;layer++)for(let i=0;i<layer?70:120;i++){let s=document.createElement("i");s.className="star";s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.opacity=.08+Math.random()*.35;s.style.setProperty("--t",2+Math.random()*5+"s");(layer?stars2:document.getElementById("stars")).appendChild(s)}}
function list(){let query=q.value.toLowerCase().trim();return tasks.filter(t=>(filter==="all"||(filter==="active"&&!t.done)||(filter==="done"&&t.done)||t.category===filter)&&(!query||`${t.title} ${t.category} ${t.notes}`.toLowerCase().includes(query)))}
function render(){field.innerHTML="";let a=list();document.getElementById("empty").style.display=a.length?"none":"flex";a.forEach((t,i)=>{let n=document.createElement("div"),s=78+Math.min(62,t.title.length*2.3)+(t.priority==="high"?18:t.priority==="medium"?8:0),ang=i/Math.max(a.length,1)*Math.PI*2-.7,r=Math.min(innerWidth,innerHeight)*(.12+(i%4)*.065),x=innerWidth/2+Math.cos(ang)*r-s/2,y=innerHeight/2+Math.sin(ang)*r-s/2;n.className="node"+(t.done?" done":"");n.style.cssText=`width:${s}px;height:${s}px;left:${x}px;top:${y}px;--fs:${s>120?12:10}px;--dur:${4+i%5*.6}s;--a:${Math.sin(i*2)*6}px;--b:${Math.cos(i*3)*6}px;--c:${Math.cos(i*2)*6}px;--d:${Math.sin(i*3)*6}px`;n.innerHTML=`<span class="name">${esc(t.title)}</span><span class="cat">${esc(t.category)}</span>`;n.onclick=()=>open(t.id);n.ondblclick=e=>{e.preventDefault();t.done=!t.done;save();render()};field.appendChild(n)});let d=tasks.filter(x=>x.done).length;document.getElementById("stats").textContent=`${tasks.length} OBJECTS · ${d} RESOLVED`}
function open(id){panel.classList.add("open");let t=tasks.find(x=>x.id===id);document.getElementById("ptitle").textContent=t?"Edit task":"New task";document.getElementById("save").textContent=t?"Save changes":"Create task";document.getElementById("delete").style.display=t?"block":"none";document.getElementById("id").value=t?.id||"";document.getElementById("title").value=t?.title||"";document.getElementById("category").value=t?.category||"College";document.getElementById("priority").value=t?.priority||"medium";document.getElementById("due").value=t?.due||"";document.getElementById("notes").value=t?.notes||"";setTimeout(()=>title.focus(),120)}
function close(){panel.classList.remove("open")}
document.getElementById("date").textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});
document.getElementById("addBtn").onclick=()=>open();document.getElementById("close").onclick=close;
document.getElementById("form").onsubmit=e=>{e.preventDefault();let id=document.getElementById("id").value,d={title:title.value.trim(),category:category.value,priority:priority.value,due:due.value,notes:notes.value.trim()};if(!d.title)return;if(id)Object.assign(tasks.find(x=>x.id===id),d);else tasks.push({id:crypto.randomUUID(),...d,done:false});save();render();close()};
document.getElementById("delete").onclick=()=>{let id=document.getElementById("id").value;tasks=tasks.filter(x=>x.id!==id);save();render();close()};
document.getElementById("searchBtn").onclick=()=>{document.getElementById("search").classList.toggle("open");if(document.getElementById("search").classList.contains("open"))q.focus()};q.oninput=render;
document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{filter=b.dataset.f;document.querySelectorAll(".filter").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){close();document.getElementById("search").classList.remove("open")}if(e.key.toLowerCase()==="n"&&!["INPUT","TEXTAREA","SELECT"].includes(document.activeElement.tagName))open()});
let down=false,lx=0,ly=0,tx=0,ty=0;field.onpointerdown=e=>{if(e.target.closest(".node"))return;down=true;lx=e.clientX;ly=e.clientY};window.onpointermove=e=>{if(!down)return;tx+=e.clientX-lx;ty+=e.clientY-ly;lx=e.clientX;ly=e.clientY;field.style.transform=`translate(${tx}px,${ty}px)`};window.onpointerup=()=>down=false;
stars();render();window.onresize=render;
</script>
</body></html>
